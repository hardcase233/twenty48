name: Twenty48
options:
  bundleIdPrefix: com.hardcase233
  deploymentTarget:
    iOS: "16.0"
targets:
  Twenty48:
    type: application
    platform: iOS
    sources: [Twenty48]
    info:
      path: Twenty48/Info.plist
      properties:
        CFBundleDisplayName: "2048"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hardcase233.twenty48
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
